[project]
name = "T2IA-streamlit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.0",
    "openai==1.64.0",
    "opencv-python-headless>=4.13.0.92",
    "scikit-image==0.25.0",
    "scikit-learn==1.6.1",
    "seaborn==0.13.2",
    "streamlit==1.45.1",
    "streamlit-image-coordinates==0.2.0",
    "streamlit-image-select==0.6.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "ultralytics==8.3.127",
]

[tool.uv]
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.8",
    "pip>=26.1.2",
    "pytest>=9.0.3",
]
